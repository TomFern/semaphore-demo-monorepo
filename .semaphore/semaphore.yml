version: v1.0
name: Monorepo Demo
agent:
  machine:
    type: s1-kubernetes
    os_image: ''
blocks:
  - name: "\U0001F469\U0001F3FB‍\U0001F3A8 — UI Service"
    dependencies: []
    task:
      prologue:
        commands:
          - checkout
          - cd services/ui
          - sem-version elixir 1.17
          - cache restore
          - mix local.hex --force
          - mix local.rebar --force
          - mix deps.get
          - mix deps.compile
          - cache store
      jobs:
        - name: Lint
          commands:
            - mix credo
        - name: Test
          commands:
            - mix test
  - name: "\U0001F64E — User Service"
    dependencies: []
    task:
      prologue:
        commands:
          - checkout
          - cd services/users
          - sem-version ruby 2.7
          - cache restore
          - bundle install
          - cache store
      jobs:
        - name: Lint
          commands:
            - bundle exec rubocop
        - name: Test
          commands:
            - bundle exec ruby test.rb
  - name: "\U0001F4B0 — Billing Service"
    dependencies: []
    task:
      prologue:
        commands:
          - checkout
          - cd services/billing
          - sem-version go 1.22
          - cache restore
          - go get ./...
          - cache store
      jobs:
        - name: Lint
          commands:
            - gofmt -l .
        - name: Test
          commands:
            - go test ./...
