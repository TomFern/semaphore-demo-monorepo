version: v1.0
name: Monorepo Demo
agent:
  machine:
    type: s1-kubernetes
    os_image: ''
blocks:
  - name: "\U0001F469\U0001F3FB‍\U0001F3A8 — UI Service"
    dependencies: []
    run:
      when: 'change_in(''/services/ui'', {exclude: ''/services/ui/**/*.md'', pipeline_file: ''ignore'' })'
    task:
      prologue:
        commands:
          - checkout
          - cd services/ui
          - '#sem-version elixir 1.16'
          - cache restore
          - mix local.hex --force
          - mix local.rebar --force
          - mix deps.get
          - mix deps.compile
          - cache store
      jobs:
        - name: Lint
          commands:
            - mix credo
        - name: Test
          commands:
            - mix test
      agent:
        machine:
          type: s1-kubernetes
          os_image: ''
        containers:
          - name: main
            image: 'registry.semaphoreci.com/elixir:1.16'
  - name: "\U0001F64E — User Service"
    dependencies: []
    run:
      when: 'change_in(''/services/users'', {exclude: ''/services/users/**/*.md'', pipeline_file: ''ignore'' })'
    task:
      prologue:
        commands:
          - checkout
          - cd services/users
          - '#sem-version ruby 2.7'
          - cache restore
          - bundle install
          - cache store
      jobs:
        - name: Lint
          commands:
            - bundle exec rubocop
        - name: Test
          commands:
            - bundle exec ruby test.rb
      agent:
        machine:
          type: s1-kubernetes
          os_image: ''
        containers:
          - name: main
            image: 'registry.semaphoreci.com/ruby:2.7'
  - name: "\U0001F4B0 — Billing Service"
    dependencies: []
    run:
      when: 'change_in(''/services/billing'', {exclude: ''/services/billing/**/*.md'', pipeline_file: ''ignore'' })'
    task:
      prologue:
        commands:
          - checkout
          - cd services/billing
          - '#sem-version go 1.22'
          - cache restore
          - go get ./...
          - cache store
      jobs:
        - name: Lint
          commands:
            - gofmt -l .
        - name: Test
          commands:
            - go test ./...
      agent:
        machine:
          type: s1-kubernetes
          os_image: ''
        containers:
          - name: main
            image: 'registry.semaphoreci.com/golang:1.22'
